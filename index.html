<!DOCTYPE html>
<html>
<head>
    <title>E-Certificate SMA 4 Cimahi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            overflow: hidden; background-color: #764ba2; /* Warna senada tema kita */
        }
        
       .wrapper {
            position: relative;
            width: 100%;
            height: 100vh; /* Menggunakan viewport height agar pas di Android */
            overflow: hidden;
        }

        iframe {
            position: absolute;
            /* Membuang banner biru Google */
            top: -45px; 
            left: 0;
            width: 100%;
            /* Trik: Jangan ditambah 45px terlalu banyak agar bawahnya tidak tenggelam */
            height: calc(100% + 45px); 
            border: none;
            
            /* Bantalan atas agar header tidak kepotong */
            padding-top: 0px;
    </style>
</head>
<body>
    <iframe src="https://script.google.com/macros/s/AKfycbzI3YECjqZbbfRapAJXinP-xp4gnbcrzwshqkTJFE25eVB1VRwJ9luSLHaKSpd8aueFMA/exec"></iframe>
</body>
</html>
